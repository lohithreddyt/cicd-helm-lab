name: Add CI CD Helm lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  lint-chart:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint chart

  build:
    needs: [test, lint-chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: lab

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo chart \
            --set image.repository=${{ needs.build.outputs.image }} \
            --set image.tag=${{ needs.build.outputs.tag }} \
            --atomic \
            --wait \
            --timeout 120s

      - name: Smoke test
        run: |
          kubectl rollout status deployment/demo --timeout=60s
          kubectl port-forward svc/demo 8080:80 &
          sleep 5
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/ | grep "${{ needs.build.outputs.tag }}"

      - name: Show release
        if: always()
        run: |
          helm list
          kubectl get pods -o wide